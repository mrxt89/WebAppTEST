services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"  # Porta HTTP (mantenuta per compatibilità)
      - "3443:3443"  # Porta HTTPS
    environment:
      - NODE_ENV=development
      - HOST_IP=${SELF_IP}
      - HOST_DOMAIN=localhost
      - PORT=3443        # Porta principale HTTPS
      - HTTP_PORT=3000   # Porta secondaria HTTP
      - API_BASE_URL=https://${SELF_IP}:3443/api
      - FRONTEND_URL=https://${SELF_IP}:5173
      - DB_USER=sa
      - DB_PASSWORD=Kacu938861
      - DB_SERVER=${DB_SERVER}
      - DB_NAME=WebAppTEST
      - DB_PORT=1433
      - ACCESS_TOKEN_SECRET=cDb!Yu6wU!2

      # Configurazione SSL
      - SSL_KEY_PATH=/usr/src/app/ssl/key.pem
      - SSL_CERT_PATH=/usr/src/app/ssl/cert.pem

      # Configurazione storage 
      - STORAGE_TYPE=local                    # Cambia a 'remote' per attivare storage remoto
      - LOCAL_STORAGE_PATH=/usr/src/app/uploads
      # - REMOTE_STORAGE_PATH=//192.168.1.100/share
      # - REMOTE_STORAGE_TYPE=mounted         # 'mounted', 'smb', o 'nfs'
      - SMB_PATH=\\\\host.docker.internal\\TestShare # in locale!
      # - STORAGE_DOMAIN=DOMAIN
      # - STORAGE_USERNAME=username
      # - STORAGE_PASSWORD=password
      
      # Ottimizzazioni Node.js per file grandi e worker threads
      - NODE_OPTIONS=--max-old-space-size=2048
      - UV_THREADPOOL_SIZE=8
      - WORKER_POOL_SIZE=2
      
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

      # Mount diretto della share Windows
      - type: bind
        source: C:/TestShare/GestDoc2/WebApp
        target: /usr/src/app/uploads
    
      # Volume per storage locale (commenta per storage remoto)
      #- ./backend/uploads:/usr/src/app/uploads
      - ./backend/temp:/usr/src/app/temp
      - ./backend/ssl:/usr/src/app/ssl  # Volume per i certificati SSL
      
    # Limiti di risorse per prevenire blocchi totali
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Health check per riavvio automatico
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Restart automatico
    restart: unless-stopped
    
    networks:
      - app-network-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"  # Porta HTTPS
      - "5174:5174"  # Porta HTTP (mantenuta per compatibilità)
    environment:
      - NODE_ENV=development
      - VITE_HOST_IP=${SELF_IP}
      - VITE_HOST_DOMAIN=localhost
      - VITE_USE_HTTPS=true
      - VITE_HTTPS_PORT=5173
      - VITE_HTTP_PORT=5174
      - VITE_API_HTTPS_PORT=3443
      - VITE_API_HTTP_PORT=3001
      - VITE_ENV=development
      - VITE_PRIMARY_COLOR=#2563eb
    volumes:
      - ./frontend:/usr/src/app:delegated
      - /usr/src/app/node_modules
      - ./ssl:/usr/src/app/ssl  # Volume per i certificati SSL dalla root
    depends_on:
      - backend
    networks:
      - app-network-dev
    restart: unless-stopped

  # Nginx come reverse proxy (opzionale ma consigliato per produzione)
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./ssl:/etc/nginx/ssl:ro
    environment:
      - HOST_IP=${SELF_IP}
      - HOST_DOMAIN=localhost
      - API_HTTPS_PORT=3443
    depends_on:
      - backend
      - frontend
    networks:
      - app-network-dev
    restart: unless-stopped

  # Wiki.js - Sistema di documentazione
  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: webapptest-wiki
    restart: unless-stopped
    ports:
      - "3002:3000"  # Porta HTTP per accesso diretto in dev
    environment:
      # Database MSSQL
      - DB_TYPE=mssql
      - "DB_HOST=host.docker.internal\\ARCHASERVER"
      - DB_PORT=1433
      - DB_USER=sa
      - DB_PASS=Kacu938861
      - DB_NAME=WikiJS
      - DB_SSL=false

      # SSL disabilitato (gestito da nginx)
      - SSL_ACTIVE=false

      # High-Availability disabilitato in dev
      - HA_ACTIVE=false

      # Logging
      - LOG_LEVEL=info
    volumes:
      - wiki-data:/wiki/data
      - wiki-config:/wiki/config
    networks:
      - app-network-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  app-network-dev:
    driver: bridge

volumes:
  wiki-data:
    driver: local
  wiki-config:
    driver: local