services:
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
    ports:
      - "3000:3000"
      - "3443:3443"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HTTPS_PORT=3443
      - USE_HTTPS=true
      - SSL_CERT_PATH=/usr/src/app/ssl/certificato.pem
      - SSL_KEY_PATH=/usr/src/app/ssl/chiave.pem
      - DB_USER=rosset
      - DB_PASSWORD=OraetLabora25-!
      - DB_SERVER=192.168.42.117
      - DB_NAME=WebApp
      - DB_PORT=1433
      - ACCESS_TOKEN_SECRET=cDb!Yu6wU!2
      - AI_FALLBACK_STRATEGY=openai-only 
      - OPENAI_API_KEY=2AA
      # RIMOSSO API_BASE_URL - non serve al backend
      - FRONTEND_URL=https://erpsrvdoc01
      
      # Configurazione storage remoto
      - STORAGE_TYPE=remote
      - REMOTE_STORAGE_TYPE=mounted
      - SMB_PATH=//192.168.42.121/crite
      - STORAGE_DOMAIN=crite.locale
      - STORAGE_USERNAME=rosset
      - STORAGE_PASSWORD=OraetLabora25-!
      - REMOTE_STORAGE_PATH=/mnt/smb_share/GestDoc2/WebApp
      
      # Configurazione SMTP
      - SMTP_HOST=smtp.office365.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      - SMTP_USER=USERNAME
      - SMTP_PASSWORD=PASSWORD
      - SMTP_FROM=pippo@mail.it
      
      # Ottimizzazioni Node.js per file grandi e worker threads
      - NODE_OPTIONS=--max-old-space-size=4096
      - UV_THREADPOOL_SIZE=16
      - WORKER_POOL_SIZE=4
      
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - ./backend/uploads:/usr/src/app/uploads
      - ./backend/temp:/usr/src/app/temp
      - ./ssl:/usr/src/app/ssl:ro
      # Mount per SMB
      - type: tmpfs
        target: /mnt/smb_share
        tmpfs:
          size: 100M
    
    # Necessario per operazioni di montaggio SMB
    privileged: true
    cap_add:
      - SYS_ADMIN
      - DAC_READ_SEARCH
    
    # Limiti di risorse per produzione
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    
    networks:
      - app-network-prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "192.168.42.121:192.168.42.121"
      - "erpsrvdoc01:192.168.42.122"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
      - "443:443"
      - "5173:443"
    environment:
      - NODE_ENV=production
      - VITE_API_URL=/api
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      # RIMOSSO il mount di nginx.conf - ora è incluso nell'immagine
    depends_on:
      backend-prod:
        condition: service_healthy
    networks:
      - app-network-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  app-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16